<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷雾小镇 - AI叙事游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e8e8e8;
}
.game-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}
header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 2px solid rgba(255,255,255,0.1);
    margin-bottom: 30px;
}
h1 {
    font-size: 2.5em;
    color: #e94560;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    margin-bottom: 10px;
}
.subtitle {
    color: #a0a0a0;
    font-size: 1.1em;
}
.game-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 25px;
}
.npc-panel {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.1);
}
.npc-panel h2 {
    color: #e94560;
    margin-bottom: 15px;
    font-size: 1.2em;
}
.npc-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.npc-card {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent;
}
.npc-card:hover, .npc-card.active {
    background: rgba(233, 69, 96, 0.15);
    border-color: #e94560;
    transform: translateX(5px);
}
.npc-avatar {
    font-size: 2em;
    margin-bottom: 8px;
}
.npc-name {
    font-weight: bold;
    color: #fff;
    margin-bottom: 5px;
}
.npc-location {
    font-size: 0.85em;
    color: #888;
}
.affection-bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
}
.affection-fill {
    height: 100%;
    background: linear-gradient(90deg, #e94560, #ff6b6b);
    border-radius: 3px;
    transition: width 0.5s ease;
}
.main-stage {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.1);
}
.story-intro {
    background: linear-gradient(135deg, rgba(233, 69, 96, 0.1), rgba(255, 107, 107, 0.1));
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    border-left: 4px solid #e94560;
}
.story-intro h3 {
    color: #e94560;
    margin-bottom: 10px;
}
.story-intro p {
    color: #ccc;
    line-height: 1.6;
}
.chat-area {
    min-height: 400px;
    max-height: 500px;
    overflow-y: auto;
    padding: 15px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    margin-bottom: 20px;
}
.message {
    margin-bottom: 15px;
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 80%;
}
.message.npc {
    background: rgba(233, 69, 96, 0.15);
    border-left: 3px solid #e94560;
}
.message.player {
    background: rgba(255,255,255,0.1);
    margin-left: auto;
    border-right: 3px solid #4ecdc4;
}
.message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 0.9em;
}
.message-avatar {
    font-size: 1.3em;
}
.message-name {
    font-weight: bold;
    color: #fff;
}
.message-mood {
    font-size: 0.75em;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
}
.message-content {
    color: #ddd;
    line-height: 1.5;
}
.input-area {
    display: flex;
    gap: 12px;
}
.input-area textarea {
    flex: 1;
    padding: 15px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1em;
    resize: vertical;
    min-height: 60px;
}
.input-area textarea:focus {
    outline: none;
    border-color: #e94560;
}
.send-btn {
    padding: 15px 30px;
    background: linear-gradient(135deg, #e94560, #ff6b6b);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}
.send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
}
.quick-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}
.quick-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: #ccc;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9em;
}
.quick-btn:hover {
    background: rgba(233, 69, 96, 0.2);
    border-color: #e94560;
    color: #fff;
}
.game-status {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
}
.status-item {
    display: flex;
    align-items: center;
    gap: 8px;
}
.status-label {
    color: #888;
    font-size: 0.9em;
}
.status-value {
    color: #e94560;
    font-weight: bold;
}
@media (max-width: 768px) {
    .game-layout {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="game-container">
    <header>
        <h1>🏛️ 迷雾小镇</h1>
        <p class="subtitle">AI叙事游戏 - 揭开迷雾背后的真相</p>
    </header>
    <div class="game-layout">
        <aside class="npc-panel">
            <h2>🎭 小镇居民</h2>
            <div class="npc-list" id="npcList"></div>
        </aside>
        <main class="main-stage">
            <div class="story-intro">
                <h3>📖 序章：迷雾降临</h3>
                <p>浓雾笼罩着这座古老的小镇，街道上空无一人。远处隐约传来钟声……你来到迷雾小镇，发现这里隐藏着不为人知的秘密。与四位关键居民对话，提升好感度，逐步揭开真相。</p>
            </div>
            <div class="game-status">
                <div class="status-item">
                    <span class="status-label">当前地点:</span>
                    <span class="status-value" id="currentLocation">小镇广场</span>
                </div>
                <div class="status-item">
                    <span class="status-label">已解锁秘密:</span>
                    <span class="status-value" id="unlockedSecrets">0/12</span>
                </div>
            </div>
            <div class="quick-actions">
                <button class="quick-btn" onclick="quickAction('greet')">👋 打招呼</button>
                <button class="quick-btn" onclick="quickAction('ask')">❓ 询问</button>
                <button class="quick-btn" onclick="quickAction('explore')">🔍 探索</button>
            </div>
            <div class="chat-area" id="chatArea"></div>
            <div class="input-area">
                <textarea id="playerInput" placeholder="输入你想说的话……" rows="2"></textarea>
                <button class="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </main>
    </div>
</div>
<script>
const NPCS = [
    { id: 'keeper', name: '老陈', avatar: '🏛️', location: '灯塔', affection: 0, 
      secrets: ['灯塔地下室有暗门', '挚友失踪与镇长有关', '午夜听到奇怪声音'] },
    { id: 'ling', name: '林医生', avatar: '🩺', location: '诊所', affection: 5,
      secrets: ['不是真正的医生', '研究迷雾物质', '药物含致幻成分'] },
    { id: 'xiaolu', name: '小鹿', avatar: '☕', location: '咖啡馆', affection: 15,
      secrets: ['见过灯塔蓝光', '被镇长警告', '有旧地图'] },
    { id: 'mayor', name: '镇长', avatar: '🎩', location: '镇公所', affection: -10,
      secrets: ['地下室藏文件', '与失踪有关', '迷雾实验'] }
];
let currentNPC = null;
let unlockedSecrets = 0;

function renderNPCs() {
    const list = document.getElementById('npcList');
    list.innerHTML = NPCS.map(npc => {
        const percent = Math.max(0, (npc.affection + 100) / 2);
        return `<div class="npc-card ${currentNPC === npc.id ? 'active' : ''}" onclick="selectNPC('${npc.id}')">
            <div class="npc-avatar">${npc.avatar}</div>
            <div class="npc-name">${npc.name}</div>
            <div class="npc-location">📍 ${npc.location}</div>
            <div class="affection-bar"><div class="affection-fill" style="width: ${percent}%"></div></div>
        </div>`;
    }).join('');
}

function selectNPC(id) {
    currentNPC = id;
    const npc = NPCS.find(n => n.id === id);
    addMessage('system', `你来到了${npc.location}，遇到了${npc.name}。`);
    renderNPCs();
}

function addMessage(type, content) {
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'message ' + type;
    div.innerHTML = `<div class="message-content">${content}</div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById('playerInput');
    const text = input.value.trim();
    if (!text) return;
    if (!currentNPC) { alert('请先选择一位NPC！'); return; }
    
    addMessage('player', text);
    input.value = '';
    
    setTimeout(() => {
        const npc = NPCS.find(n => n.id === currentNPC);
        const responses = [
            `...你有什么事吗？我忙着呢。`,
            `最近镇上的事确实有些奇怪……你怎么看？`,
            `既然是你问的，我就直说了。那天晚上的事，我一直憋在心里没敢讲。`
        ];
        const reply = responses[Math.floor(Math.random() * responses.length)];
        addMessage('npc', `<strong>${npc.name}</strong>: ${reply}`);
        
        npc.affection = Math.min(100, npc.affection + 5);
        unlockedSecrets = Math.floor(NPCS.reduce((sum, n) => sum + (n.affection > 30 ? 1 : 0), 0) / 4);
        document.getElementById('unlockedSecrets').textContent = `${unlockedSecrets}/12`;
        renderNPCs();
    }, 1000);
}

function quickAction(type) {
    const actions = { greet: '你好，我是新来的。', ask: '这里有什么传闻吗？', explore: '能带我看看吗？' };
    document.getElementById('playerInput').value = actions[type];
    sendMessage();
}

document.getElementById('playerInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

renderNPCs();
</script>
</body>
</html>
